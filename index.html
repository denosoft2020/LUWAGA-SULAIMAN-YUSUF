<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luwaga Sulaiman Yusuf</title>
  <meta http-equiv="refresh" content="5; url=./portifolio/index.html">
  <link rel="canonical" href="./portifolio/index.html">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #243447;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }

    main {
      width: min(640px, 100%);
      background: rgba(30, 41, 59, 0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.8rem;
      color: #fff;
    }

    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.1rem;
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      border: 1px solid transparent;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-1px);
      background: #2563eb;
    }

    .links a.secondary {
      background: var(--panel-2);
      border-color: var(--border);
      color: var(--text);
    }

    .links a.secondary:hover {
      background: #2f425a;
    }

    .note {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
  </style>
  <script>
    // Keep the redirect, but give the page a few seconds to act as a quick hub.
    window.setTimeout(() => {
      window.location.replace('./portifolio/index.html');
    }, 5000);
  </script>
</head>
<body>
  <main>
    <h1>Luwaga Sulaiman Yusuf</h1>
    <p>Redirecting to the portfolio page in 5 seconds. If you want to jump directly, use the links below.</p>
    <div class="links">
      <a href="./portifolio/index.html#contact">Resume</a>
      <a href="./portifolio/index.html#skills" class="secondary">Skills</a>
      <a href="./portifolio/index.html" class="secondary">Open Portfolio</a>
    </div>
    <div class="note">The portfolio page contains the full resume and skills sections.</div>
  </main>
</body>
</html>
